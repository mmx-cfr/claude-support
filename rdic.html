<!DOCTYPE html>
<html>
<head>
  <title>Opening Claude...</title>
  <script>
    const params = new URLSearchParams(window.location.search);
    const q = params.get("q") || "Run the design intake check";
    const deepLink = "claude://cowork/new?q=" + encodeURIComponent(q);
    window.location.href = deepLink;
  </script>
</head>
<body>
  <p>Opening Claude...</p>
  <p id="fallback"></p>
  <script>
    const link = document.getElementById("fallback");
    link.innerHTML = '<a href="' + deepLink + '">Click here if it doesn\'t open automatically.</a>';
  </script>
</body>
</html>
